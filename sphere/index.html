<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpaceXAI · Sphere</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="sphere-root">
    <canvas id="sphere-canvas"></canvas>

    <div class="hud hud-left" aria-hidden="true">
      <div class="ticker">TSLA <span class="up">+0.96%</span></div>
      <div class="ticker">SPCX <span class="up">+1.89%</span></div>
    </div>
    <div class="hud hud-right" aria-hidden="true">To the Moon!</div>

    <div class="hint" id="hint">Click sphere · Space · Voice wake</div>

    <div class="wake-panel" id="wake-panel" hidden>
      <div class="wake-chrome">
        <div class="wake-brand">SpaceXAI · Sphere</div>
        <div class="wake-tag">Your bots. One sphere.</div>
      </div>
      <ul class="bot-list" id="bot-list" role="listbox" aria-label="Bots"></ul>
    </div>

    <button type="button" class="voice-btn" id="voice-wake" title="Voice wake (stub)">
      Voice wake
    </button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
